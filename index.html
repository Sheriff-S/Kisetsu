<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kisetsu — Seasonal Anime Log</title>
<link rel="icon" href="data:,">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');
  * { box-sizing: border-box; }
  body { margin: 0; background: #14161A; }
  .disp { font-family: 'Zen Kaku Gothic New', sans-serif; }
  .mono { font-family: 'Space Mono', monospace; }
  input, textarea, select, button { font-family: 'Inter', sans-serif; }

  .row {
    display: grid;
    grid-template-columns: 74px 1.3fr 1.5fr 1.3fr 1.1fr 32px;
    gap: 18px;
    padding: 20px 8px;
    border-bottom: 1px solid #22252b;
    align-items: start;
  }
  .table-header {
    display: grid;
    grid-template-columns: 74px 1.3fr 1.5fr 1.3fr 1.1fr 32px;
    gap: 18px;
    padding: 0 8px 10px;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #6a6d74;
    border-bottom: 1px solid #2c2f36;
  }
  .col-label { display: none; }

  @media (max-width: 860px) {
    .table-header { display: none; }
    .row { grid-template-columns: 1fr; gap: 6px; padding: 18px 4px; }
    .col-label {
      display: block; font-family: 'Space Mono', monospace; font-size: 10px;
      text-transform: uppercase; letter-spacing: 0.05em; color: #6a6d74; margin-bottom: 3px;
    }
    .photo-block { display: flex; gap: 12px; align-items: center; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback } = React;

// =========================================================================

//    Project Settings → API → Project URL / anon public key
// =========================================================================
const SUPABASE_URL = "https://vtfapuvsojxomtjgqyog.supabase.co/rest/v1/";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ0ZmFwdXZzb2p4b210amdxeW9nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0ODQ2ODgsImV4cCI6MjEwMTA2MDY4OH0.Tt7q6YTeO80dSn4bhsZDrLs2kQmAfpdGW7_ecS27B9k
";

const CONFIGURED =
  SUPABASE_URL.startsWith("https://") && SUPABASE_ANON_KEY.length > 40;

const supabase = CONFIGURED
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

function SetupNotice() {
  const step = { margin: "0 0 10px", fontSize: 13, lineHeight: 1.6, color: "#c9c6bd" };
  const code = { fontFamily: "'Space Mono', monospace", background: "#14161A", border: "1px solid #2c2f36", borderRadius: 4, padding: "1px 5px", fontSize: 12 };
  return (
    <div style={{ background: "#14161A", minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'Inter', sans-serif", color: "#EDEAE2", padding: 20 }}>
      <div style={{ maxWidth: 420, width: "100%", background: "#1c1e24", border: "1px solid #26292f", borderRadius: 14, padding: 24 }}>
        <h1 className="disp" style={{ fontSize: 22, fontWeight: 900, margin: "0 0 6px" }}>
          季節<span style={{ color: "#D0678C" }}>.</span>Kisetsu
        </h1>
        <p style={{ fontSize: 13, color: "#8a8d94", margin: "0 0 18px" }}>
          Almost ready — the app needs your Supabase keys before it can run.
        </p>
        <p style={step}>1. Create a free project at <span style={code}>supabase.com</span></p>
        <p style={step}>2. SQL Editor → paste and run <span style={code}>supabase-schema.sql</span></p>
        <p style={step}>3. Project Settings → API → copy the Project URL and anon public key</p>
        <p style={step}>4. In this file, replace <span style={code}>YOUR_SUPABASE_PROJECT_URL</span> and <span style={code}>YOUR_SUPABASE_ANON_KEY</span> near the top of the script</p>
        <p style={{ ...step, margin: 0 }}>5. Reload this page</p>
      </div>
    </div>
  );
}

const SEASONS = [
  { id: "winter", label: "Winter", kanji: "冬", months: "Jan–Mar", color: "#4A7A9D" },
  { id: "spring", label: "Spring", kanji: "春", months: "Apr–Jun", color: "#D0678C" },
  { id: "summer", label: "Summer", kanji: "夏", months: "Jul–Sep", color: "#E0632B" },
  { id: "fall", label: "Fall", kanji: "秋", months: "Oct–Dec", color: "#B5761F" },
];

const STATUSES = [
  { id: "planning", label: "Plan to watch" },
  { id: "watching", label: "Watching" },
  { id: "completed", label: "Completed" },
  { id: "dropped", label: "Dropped" },
];

function currentSeasonForDate(d) {
  const m = d.getMonth();
  if (m <= 2) return "winter";
  if (m <= 5) return "spring";
  if (m <= 8) return "summer";
  return "fall";
}

function fromDb(row) {
  return {
    id: row.id,
    title: row.title,
    studio: row.studio || "",
    genres: row.genres || [],
    season: row.season,
    year: row.year,
    status: row.status,
    episodesWatched: row.episodes_watched || 0,
    totalEpisodes: row.total_episodes || 0,
    rating: row.rating,
    imageUrl: row.image_url || "",
    synopsis: row.synopsis || "",
    notes: row.notes || "",
    staff: row.staff || [],
  };
}
function toDb(entry, userId) {
  return {
    user_id: userId,
    title: entry.title,
    studio: entry.studio,
    genres: entry.genres,
    season: entry.season,
    year: entry.year,
    status: entry.status,
    episodes_watched: entry.episodesWatched,
    total_episodes: entry.totalEpisodes,
    rating: entry.rating,
    image_url: entry.imageUrl,
    synopsis: entry.synopsis,
    notes: entry.notes,
    staff: entry.staff,
  };
}

function StarRating({ value, onChange, readOnly }) {
  const stars = [1, 2, 3, 4, 5];
  const filled = value ? Math.round(value / 2) : 0;
  return (
    <div style={{ display: "flex", gap: 2 }}>
      {stars.map((s) => (
        <button key={s} type="button" disabled={readOnly} onClick={() => onChange && onChange(s * 2)}
          style={{ fontSize: 14, lineHeight: 1, background: "none", border: "none", padding: 0,
            cursor: readOnly ? "default" : "pointer", color: s <= filled ? "currentColor" : "#3a3d44" }}
          aria-label={`Rate ${s * 2} of 10`}>★</button>
      ))}
    </div>
  );
}

const inputStyle = {
  width: "100%", background: "#14161A", border: "1px solid #2c2f36", borderRadius: 8,
  padding: "9px 10px", color: "#EDEAE2", fontSize: 13, boxSizing: "border-box", outline: "none",
};
const labelStyle = { fontSize: 12, color: "#8a8d94", display: "block", marginBottom: 4 };
const yearBtnStyle = { background: "none", border: "1px solid #2c2f36", color: "#EDEAE2", borderRadius: 6, width: 28, height: 28, cursor: "pointer" };
const iconBtnStyle = { background: "none", border: "1px solid #2c2f36", color: "#8a8d94", borderRadius: 6, width: 26, height: 26, cursor: "pointer", fontSize: 12 };

function AuthScreen() {
  const [mode, setMode] = useState("signin");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [info, setInfo] = useState("");
  const [busy, setBusy] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setError(""); setInfo(""); setBusy(true);
    try {
      if (mode === "signup") {
        const { error } = await supabase.auth.signUp({ email, password });
        if (error) throw error;
        setInfo("Check your email to confirm your account, then sign in.");
      } else {
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
      }
    } catch (err) {
      setError(err.message || "Something went wrong.");
    } finally {
      setBusy(false);
    }
  };

  return (
    <div style={{ background: "#14161A", minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'Inter', sans-serif", color: "#EDEAE2", padding: 20 }}>
      <div style={{ width: "100%", maxWidth: 360 }}>
        <h1 className="disp" style={{ fontSize: 30, fontWeight: 900, margin: "0 0 4px", textAlign: "center" }}>
          季節<span style={{ color: "#D0678C" }}>.</span>Kisetsu
        </h1>
        <p style={{ textAlign: "center", color: "#8a8d94", fontSize: 13, margin: "0 0 24px" }}>your seasonal anime log</p>

        <form onSubmit={submit} style={{ background: "#1c1e24", border: "1px solid #26292f", borderRadius: 14, padding: 24 }}>
          <label style={labelStyle}>Email</label>
          <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)} style={inputStyle} placeholder="you@example.com" />

          <label style={{ ...labelStyle, marginTop: 12 }}>Password</label>
          <input type="password" required minLength={6} value={password} onChange={(e) => setPassword(e.target.value)} style={inputStyle} placeholder="At least 6 characters" />

          {error && <p style={{ color: "#e0a0a0", fontSize: 12, marginTop: 10 }}>{error}</p>}
          {info && <p style={{ color: "#9bc99b", fontSize: 12, marginTop: 10 }}>{info}</p>}

          <button type="submit" disabled={busy} style={{ width: "100%", marginTop: 16, background: "#D0678C", border: "none", color: "#14161A", borderRadius: 8, padding: "10px 0", fontWeight: 700, fontSize: 13, cursor: busy ? "wait" : "pointer" }}>
            {busy ? "Please wait…" : mode === "signup" ? "Create account" : "Sign in"}
          </button>
        </form>

        <p style={{ textAlign: "center", fontSize: 12, color: "#6a6d74", marginTop: 16 }}>
          {mode === "signup" ? "Already have an account?" : "New here?"}{" "}
          <button onClick={() => { setMode(mode === "signup" ? "signin" : "signup"); setError(""); setInfo(""); }} style={{ background: "none", border: "none", color: "#D0678C", cursor: "pointer", fontSize: 12, textDecoration: "underline" }}>
            {mode === "signup" ? "Sign in" : "Create one"}
          </button>
        </p>
      </div>
    </div>
  );
}

function App({ session, onSignOut }) {
  const user = session.user;
  const [entries, setEntries] = useState([]);
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [year, setYear] = useState(2026);
  const [season, setSeason] = useState(currentSeasonForDate(new Date()));
  const [statusFilter, setStatusFilter] = useState("all");
  const [formOpen, setFormOpen] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [draft, setDraft] = useState(null);
  const [error, setError] = useState("");

  const loadEntries = useCallback(async () => {
    setLoading(true);
    const { data, error } = await supabase.from("entries").select("*").order("created_at", { ascending: true });
    if (error) setError("Couldn't load your log: " + error.message);
    else setEntries(data.map(fromDb));
    setLoading(false);
  }, []);

  useEffect(() => { loadEntries(); }, [loadEntries]);

  const seasonMeta = SEASONS.find((s) => s.id === season);
  const visible = entries.filter((e) => e.season === season && e.year === year && (statusFilter === "all" || e.status === statusFilter));

  const openNewForm = () => {
    setDraft({ title: "", studio: "", genres: "", season, year, status: "planning", episodesWatched: 0, totalEpisodes: 12, rating: null, imageUrl: "", synopsis: "", notes: "", staff: [{ name: "", role: "", url: "" }] });
    setEditingId(null);
    setFormOpen(true);
  };
  const openEditForm = (entry) => {
    setDraft({ ...entry, genres: entry.genres.join(", "), staff: entry.staff.length ? entry.staff : [{ name: "", role: "", url: "" }] });
    setEditingId(entry.id);
    setFormOpen(true);
  };

  const saveDraft = async () => {
    if (!draft.title.trim()) return;
    setSaving(true); setError("");
    const clean = {
      ...draft,
      genres: draft.genres.split(",").map((g) => g.trim()).filter(Boolean),
      episodesWatched: Number(draft.episodesWatched) || 0,
      totalEpisodes: Number(draft.totalEpisodes) || 0,
      rating: draft.rating === null || draft.rating === "" ? null : Number(draft.rating),
      staff: draft.staff.filter((p) => p.name.trim()),
    };
    if (editingId) {
      const { error } = await supabase.from("entries").update(toDb(clean, user.id)).eq("id", editingId);
      if (error) setError(error.message);
    } else {
      const { error } = await supabase.from("entries").insert([toDb(clean, user.id)]);
      if (error) setError(error.message);
    }
    await loadEntries();
    setSaving(false); setFormOpen(false); setDraft(null); setEditingId(null);
  };

  const removeEntry = async (id) => {
    setSaving(true);
    const { error } = await supabase.from("entries").delete().eq("id", id);
    if (error) setError(error.message);
    await loadEntries();
    setSaving(false);
  };

  const updateStaffRow = (idx, field, value) => {
    const staffArr = [...draft.staff];
    staffArr[idx] = { ...staffArr[idx], [field]: value };
    setDraft({ ...draft, staff: staffArr });
  };
  const addStaffRow = () => setDraft({ ...draft, staff: [...draft.staff, { name: "", role: "", url: "" }] });
  const removeStaffRow = (idx) => setDraft({ ...draft, staff: draft.staff.filter((_, i) => i !== idx) });

  const statusColor = (s) => ({ watching: "#4A7A9D", completed: "#5C8A5C", dropped: "#A65858", planning: "#8a8d94" }[s] || "#8a8d94");

  if (loading) {
    return <div style={{ background: "#14161A", minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", color: "#8a8d94", fontFamily: "Inter, sans-serif" }}>Loading your log…</div>;
  }

  return (
    <div style={{ background: "#14161A", minHeight: "100vh", fontFamily: "'Inter', sans-serif", color: "#EDEAE2" }}>
      <header style={{ borderBottom: "1px solid #24262c", padding: "28px 24px 0" }}>
        <div style={{ maxWidth: 1180, margin: "0 auto" }}>
          <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", flexWrap: "wrap", gap: 12 }}>
            <div>
              <h1 className="disp" style={{ fontSize: 34, fontWeight: 900, margin: 0, letterSpacing: "-0.02em" }}>
                季節<span style={{ color: seasonMeta.color }}>.</span>Kisetsu
              </h1>
              <p style={{ margin: "4px 0 0", color: "#8a8d94", fontSize: 13 }}>signed in as {user.email}</p>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
              <div className="mono" style={{ display: "flex", alignItems: "center", gap: 10, fontSize: 15 }}>
                <button onClick={() => setYear((y) => y - 1)} style={yearBtnStyle} aria-label="Previous year">‹</button>
                <span style={{ minWidth: 48, textAlign: "center" }}>{year}</span>
                <button onClick={() => setYear((y) => y + 1)} style={yearBtnStyle} aria-label="Next year">›</button>
              </div>
              <button onClick={onSignOut} style={{ background: "none", border: "1px solid #2c2f36", color: "#8a8d94", borderRadius: 6, padding: "6px 12px", fontSize: 12, cursor: "pointer" }}>Sign out</button>
            </div>
          </div>

          <div style={{ display: "flex", gap: 8, marginTop: 24, overflowX: "auto" }}>
            {SEASONS.map((s) => {
              const active = s.id === season;
              return (
                <button key={s.id} onClick={() => setSeason(s.id)} style={{
                  flex: "1 1 0", minWidth: 130, background: active ? s.color : "transparent", color: active ? "#14161A" : "#EDEAE2",
                  border: `1px solid ${active ? s.color : "#2c2f36"}`, borderRadius: "10px 10px 0 0", padding: "12px 14px", cursor: "pointer",
                  display: "flex", alignItems: "center", gap: 10,
                }}>
                  <span className="disp" style={{ fontSize: 22, fontWeight: 700, opacity: active ? 0.85 : 0.5 }}>{s.kanji}</span>
                  <span style={{ textAlign: "left" }}>
                    <span style={{ display: "block", fontWeight: 700, fontSize: 14 }}>{s.label}</span>
                    <span className="mono" style={{ display: "block", fontSize: 10, opacity: 0.75 }}>{s.months}</span>
                  </span>
                </button>
              );
            })}
          </div>
        </div>
      </header>

      <div style={{ maxWidth: 1180, margin: "0 auto", padding: "20px 24px 0", display: "flex", flexWrap: "wrap", gap: 12, alignItems: "center", justifyContent: "space-between" }}>
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
          {["all", ...STATUSES.map((s) => s.id)].map((f) => (
            <button key={f} onClick={() => setStatusFilter(f)} style={{
              fontSize: 12, padding: "6px 12px", borderRadius: 999, border: `1px solid ${statusFilter === f ? seasonMeta.color : "#2c2f36"}`,
              background: statusFilter === f ? seasonMeta.color : "transparent", color: statusFilter === f ? "#14161A" : "#8a8d94", cursor: "pointer", fontWeight: 600,
            }}>
              {f === "all" ? "All" : STATUSES.find((s) => s.id === f).label}
            </button>
          ))}
        </div>
        <button onClick={openNewForm} style={{ background: seasonMeta.color, color: "#14161A", border: "none", padding: "9px 16px", borderRadius: 8, fontWeight: 700, fontSize: 13, cursor: "pointer" }}>+ Log a title</button>
      </div>

      {error && <div style={{ maxWidth: 1180, margin: "16px auto 0", padding: "10px 14px", background: "#3a2323", color: "#e0a0a0", borderRadius: 8, fontSize: 13 }}>{error}</div>}

      <main style={{ maxWidth: 1180, margin: "0 auto", padding: "24px", paddingBottom: 80 }}>
        {visible.length === 0 ? (
          <div style={{ textAlign: "center", padding: "80px 20px", color: "#6a6d74" }}>
            <div className="disp" style={{ fontSize: 40, marginBottom: 8, color: seasonMeta.color, opacity: 0.6 }}>{seasonMeta.kanji}</div>
            <p style={{ margin: 0, fontSize: 14 }}>Nothing logged for {seasonMeta.label} {year} yet.</p>
            <button onClick={openNewForm} style={{ marginTop: 14, background: "none", border: `1px solid ${seasonMeta.color}`, color: seasonMeta.color, padding: "8px 16px", borderRadius: 8, cursor: "pointer", fontSize: 13, fontWeight: 600 }}>Add the first title</button>
          </div>
        ) : (
          <div>
            <div className="table-header"><span>Photo</span><span>General info</span><span>Synopsis</span><span>Editor's notes</span><span>Staff</span><span></span></div>
            {visible.map((entry) => {
              const pct = entry.totalEpisodes ? Math.min(100, Math.round((entry.episodesWatched / entry.totalEpisodes) * 100)) : 0;
              return (
                <div key={entry.id} className="row">
                  <div className="photo-block">
                    {entry.imageUrl ? (
                      <img src={entry.imageUrl} alt={entry.title} style={{ width: 64, height: 64, objectFit: "cover", borderRadius: 8, border: "1px solid #26292f" }} />
                    ) : (
                      <div className="disp" style={{ width: 64, height: 64, borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "center", background: `linear-gradient(135deg, ${seasonMeta.color}55, #1c1e24)`, color: seasonMeta.color, fontSize: 22, fontWeight: 700, border: "1px solid #26292f", flexShrink: 0 }}>
                        {seasonMeta.kanji}
                      </div>
                    )}
                  </div>
                  <div>
                    <span className="col-label">General info</span>
                    <h3 className="disp" style={{ margin: 0, fontSize: 15, fontWeight: 700, lineHeight: 1.3 }}>{entry.title}</h3>
                    {entry.studio && <p style={{ margin: "3px 0 0", fontSize: 12, color: "#8a8d94" }}>{entry.studio}</p>}
                    {entry.genres.length > 0 && <div style={{ display: "flex", gap: 5, flexWrap: "wrap", marginTop: 6 }}>{entry.genres.map((g) => <span key={g} className="mono" style={{ fontSize: 10, color: "#8a8d94", border: "1px solid #2c2f36", borderRadius: 4, padding: "2px 6px" }}>{g}</span>)}</div>}
                    <span className="mono" style={{ display: "inline-block", marginTop: 8, fontSize: 10, fontWeight: 700, padding: "3px 8px", borderRadius: 999, background: statusColor(entry.status) + "33", color: statusColor(entry.status) }}>{STATUSES.find((s) => s.id === entry.status).label}</span>
                    <div style={{ marginTop: 8 }}>
                      <div className="mono" style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "#8a8d94", marginBottom: 3 }}><span>EP {entry.episodesWatched}/{entry.totalEpisodes || "?"}</span><span>{pct}%</span></div>
                      <div style={{ height: 4, background: "#26292f", borderRadius: 3, overflow: "hidden" }}><div style={{ height: "100%", width: `${pct}%`, background: seasonMeta.color }} /></div>
                    </div>
                    <div style={{ marginTop: 8, color: seasonMeta.color }}><StarRating value={entry.rating} readOnly /></div>
                  </div>
                  <div>
                    <span className="col-label">Synopsis</span>
                    <p style={{ margin: 0, fontSize: 13, color: entry.synopsis ? "#c9c6bd" : "#5c5f66", lineHeight: 1.5 }}>{entry.synopsis || "No synopsis added."}</p>
                  </div>
                  <div>
                    <span className="col-label">Editor's notes</span>
                    <p style={{ margin: 0, fontSize: 13, color: entry.notes ? "#c9c6bd" : "#5c5f66", lineHeight: 1.5, fontStyle: entry.notes ? "normal" : "italic" }}>{entry.notes || "No notes yet."}</p>
                  </div>
                  <div>
                    <span className="col-label">Staff</span>
                    {entry.staff.length > 0 ? (
                      <ul style={{ listStyle: "none", margin: 0, padding: 0, display: "flex", flexDirection: "column", gap: 5 }}>
                        {entry.staff.map((p, i) => (
                          <li key={i} style={{ fontSize: 12, lineHeight: 1.4 }}>
                            {p.url ? <a href={p.url} target="_blank" rel="noopener noreferrer" style={{ color: seasonMeta.color, textDecoration: "none" }}>{p.name}</a> : <span style={{ color: "#c9c6bd" }}>{p.name}</span>}
                            {p.role && <span style={{ color: "#6a6d74" }}> — {p.role}</span>}
                          </li>
                        ))}
                      </ul>
                    ) : <p style={{ margin: 0, fontSize: 12, color: "#5c5f66", fontStyle: "italic" }}>No staff linked.</p>}
                  </div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 6, alignItems: "flex-end" }}>
                    <button onClick={() => openEditForm(entry)} aria-label="Edit" style={iconBtnStyle}>✎</button>
                    <button onClick={() => removeEntry(entry.id)} aria-label="Remove" style={{ ...iconBtnStyle, color: "#c47a7a" }}>✕</button>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </main>

      {saving && <div className="mono" style={{ position: "fixed", bottom: 16, right: 16, fontSize: 11, color: "#6a6d74", background: "#1c1e24", border: "1px solid #26292f", padding: "6px 10px", borderRadius: 6 }}>saving…</div>}

      {formOpen && draft && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(10,11,13,0.7)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20, zIndex: 50 }} onClick={() => setFormOpen(false)}>
          <div onClick={(e) => e.stopPropagation()} style={{ background: "#1c1e24", border: "1px solid #26292f", borderRadius: 14, maxWidth: 520, width: "100%", maxHeight: "88vh", overflowY: "auto", padding: 24 }}>
            <h2 className="disp" style={{ margin: "0 0 16px", fontSize: 20, fontWeight: 700 }}>{editingId ? "Edit entry" : "Log a title"}</h2>
            <label style={labelStyle}>Title</label>
            <input value={draft.title} onChange={(e) => setDraft({ ...draft, title: e.target.value })} placeholder="e.g. Frieren: Beyond Journey's End" style={inputStyle} />
            <label style={{ ...labelStyle, marginTop: 12 }}>Photo URL</label>
            <input value={draft.imageUrl} onChange={(e) => setDraft({ ...draft, imageUrl: e.target.value })} placeholder="https://…" style={inputStyle} />
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginTop: 12 }}>
              <div><label style={labelStyle}>Studio</label><input value={draft.studio} onChange={(e) => setDraft({ ...draft, studio: e.target.value })} style={inputStyle} /></div>
              <div><label style={labelStyle}>Genres (comma sep.)</label><input value={draft.genres} onChange={(e) => setDraft({ ...draft, genres: e.target.value })} style={inputStyle} /></div>
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, margin: "12px 0" }}>
              <div>
                <label style={labelStyle}>Season</label>
                <select value={draft.season} onChange={(e) => setDraft({ ...draft, season: e.target.value })} style={inputStyle}>
                  {SEASONS.map((s) => <option key={s.id} value={s.id}>{s.label}</option>)}
                </select>
              </div>
              <div><label style={labelStyle}>Year</label><input type="number" value={draft.year} onChange={(e) => setDraft({ ...draft, year: Number(e.target.value) })} style={inputStyle} /></div>
            </div>
            <label style={labelStyle}>Status</label>
            <select value={draft.status} onChange={(e) => setDraft({ ...draft, status: e.target.value })} style={inputStyle}>
              {STATUSES.map((s) => <option key={s.id} value={s.id}>{s.label}</option>)}
            </select>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, margin: "12px 0" }}>
              <div><label style={labelStyle}>Episodes watched</label><input type="number" min="0" value={draft.episodesWatched} onChange={(e) => setDraft({ ...draft, episodesWatched: e.target.value })} style={inputStyle} /></div>
              <div><label style={labelStyle}>Total episodes</label><input type="number" min="0" value={draft.totalEpisodes} onChange={(e) => setDraft({ ...draft, totalEpisodes: e.target.value })} style={inputStyle} /></div>
            </div>
            <label style={labelStyle}>Rating</label>
            <div style={{ display: "flex", alignItems: "center", gap: 10, color: SEASONS.find((s) => s.id === draft.season).color }}>
              <StarRating value={draft.rating} onChange={(v) => setDraft({ ...draft, rating: v })} />
              <span className="mono" style={{ fontSize: 12, color: "#8a8d94" }}>{draft.rating ? `${draft.rating}/10` : "unrated"}</span>
              {draft.rating != null && <button onClick={() => setDraft({ ...draft, rating: null })} style={{ background: "none", border: "none", color: "#6a6d74", fontSize: 11, cursor: "pointer" }}>clear</button>}
            </div>
            <label style={{ ...labelStyle, marginTop: 12 }}>Synopsis</label>
            <textarea value={draft.synopsis} onChange={(e) => setDraft({ ...draft, synopsis: e.target.value })} rows={3} placeholder="Official-style blurb…" style={{ ...inputStyle, resize: "vertical" }} />
            <label style={{ ...labelStyle, marginTop: 12 }}>Editor's notes</label>
            <textarea value={draft.notes} onChange={(e) => setDraft({ ...draft, notes: e.target.value })} rows={3} placeholder="Your own thoughts…" style={{ ...inputStyle, resize: "vertical" }} />
            <label style={{ ...labelStyle, marginTop: 12 }}>Staff</label>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {draft.staff.map((p, i) => (
                <div key={i} style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 24px", gap: 6, alignItems: "center" }}>
                  <input value={p.name} onChange={(e) => updateStaffRow(i, "name", e.target.value)} placeholder="Name" style={inputStyle} />
                  <input value={p.role} onChange={(e) => updateStaffRow(i, "role", e.target.value)} placeholder="Role" style={inputStyle} />
                  <input value={p.url} onChange={(e) => updateStaffRow(i, "url", e.target.value)} placeholder="Link (optional)" style={inputStyle} />
                  <button onClick={() => removeStaffRow(i)} style={{ background: "none", border: "none", color: "#c47a7a", cursor: "pointer", fontSize: 14 }} aria-label="Remove staff row">✕</button>
                </div>
              ))}
              <button onClick={addStaffRow} style={{ alignSelf: "flex-start", background: "none", border: "1px dashed #2c2f36", color: "#8a8d94", borderRadius: 6, padding: "5px 10px", fontSize: 12, cursor: "pointer" }}>+ Add staff</button>
            </div>
            <div style={{ display: "flex", gap: 10, marginTop: 20 }}>
              <button onClick={() => { setFormOpen(false); setDraft(null); setEditingId(null); }} style={{ flex: 1, background: "none", border: "1px solid #2c2f36", color: "#EDEAE2", borderRadius: 8, padding: "10px 0", cursor: "pointer", fontSize: 13 }}>Cancel</button>
              <button onClick={saveDraft} disabled={!draft.title.trim()} style={{ flex: 1, background: draft.title.trim() ? SEASONS.find((s) => s.id === draft.season).color : "#3a3d44", border: "none", color: "#14161A", borderRadius: 8, padding: "10px 0", cursor: draft.title.trim() ? "pointer" : "not-allowed", fontSize: 13, fontWeight: 700 }}>
                {editingId ? "Save changes" : "Add to log"}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function Root() {
  const [session, setSession] = useState(undefined);

  useEffect(() => {
    if (!CONFIGURED) return;
    supabase.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: listener } = supabase.auth.onAuthStateChange((_event, s) => setSession(s));
    return () => listener.subscription.unsubscribe();
  }, []);

  if (!CONFIGURED) return <SetupNotice />;

  if (session === undefined) {
    return <div style={{ background: "#14161A", minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", color: "#8a8d94", fontFamily: "Inter, sans-serif" }}>Loading…</div>;
  }
  if (!session) return <AuthScreen />;
  return <App session={session} onSignOut={() => supabase.auth.signOut()} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>
</body>
</html>
